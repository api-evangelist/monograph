name: Monograph
description: 'Monograph is firm-management software purpose-built for architecture and
  engineering (A&E) practices, unifying project management, resourcing and staffing,
  time tracking, budgeting, invoicing and client payments in one connected system.
  Used by thousands of US-based A&E firms, it integrates with QuickBooks Online, Stripe,
  Google Workspace and Microsoft 365, but publishes no public developer API, webhooks,
  or SDKs. Backed by Homebrew and Index Ventures.'
